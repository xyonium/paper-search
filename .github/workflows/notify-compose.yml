name: Notify compose to rebuild papers-service

# tool.py 的唯一实现在本仓库；compose 的 papers-service 镜像构建时用
# PAPER_SEARCH_REF=<main sha> 把 tool.py ADD 进去，所以本仓库 push 不会命中
# compose 的 paths 过滤——这里用 repository_dispatch 显式通知它重建。
#
# 需要 secret COMPOSE_DISPATCH_TOKEN：fine-grained PAT，仅 xyonium/compose 的
# contents: write（创建后到 Settings → Secrets and variables → Actions 添加）。
# 未配置时直接失败（不再绿色跳过）：notify 绿必须等于 dispatch 已送达，
# 否则 tool.py 更新会静默不重建。手动补跑用 workflow_dispatch。

on:
  push:
    branches: [main]
    paths:
      - "tool.py"
  # 手动重发（PAT 换新/补跑/验证链路）；不受 paths 过滤影响
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch paper-search-updated to xyonium/compose
        env:
          COMPOSE_DISPATCH_TOKEN: ${{ secrets.COMPOSE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${COMPOSE_DISPATCH_TOKEN}" ]; then
            echo "::error::COMPOSE_DISPATCH_TOKEN 未配置——tool.py 更新不会触发 compose 重建；到仓库 Settings → Secrets 添加"
            exit 1
          fi
          code=$(curl -sS -o /tmp/dispatch.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${COMPOSE_DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/xyonium/compose/dispatches \
            -d '{"event_type":"paper-search-updated"}')
          cat /tmp/dispatch.json
          if [ "$code" != "204" ]; then
            echo "::error::repository_dispatch 失败（HTTP $code）——检查 PAT 是否过期/权限是否含 compose contents:write"
            exit 1
          fi
          echo "dispatched paper-search-updated"
